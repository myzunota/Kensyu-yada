<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研修嫌だ | 映画ポスター風Webページ</title>
    <style>
        /* 全体のスタイル */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #111, #333);
            color: white;
            font-family: 'Arial', sans-serif;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 映画タイトル */
        .title {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.7);
        }

        /* サブタイトル */
        .subtitle {
            font-size: 2rem;
            margin-top: 10px;
            font-weight: 300;
            color: #ccc;
        }

        /* キャッチコピー */
        .catchphrase {
            font-size: 1.5rem;
            margin-top: 20px;
            padding: 10px 20px;
            border: 2px solid white;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
        }

        /* ボタン */
        .cta {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 1.2rem;
            background: red;
            color: white;
            border: none;
            cursor: pointer;
            transition: 0.3s ease-in-out;
        }

        .cta:hover {
            background: darkred;
        }
    </style>
</head>
<body>
    <div class="title">研修嫌だ</div>
    <div class="subtitle">仕事も嫌</div>
    <div class="catchphrase">在宅だけが唯一の救い</div>
    <button class="cta">詳細を見る</button>
</body>
</html>
